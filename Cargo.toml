[package]
name = "vmkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "VMM-neutral microVM lifecycle for Firecracker and Cloud Hypervisor"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["thread", "mount", "process", "fs", "stdio"] }
